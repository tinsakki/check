<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Anjali ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', sans-serif;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  background: linear-gradient(-45deg, #ff4e50, #fc913a, #ff6f91, #845ec2);
  background-size: 400% 400%;
  animation: gradientBG 12s ease infinite;
  color: white;
}

@keyframes gradientBG {
  0% {background-position: 0% 50%;}
  50% {background-position: 100% 50%;}
  100% {background-position: 0% 50%;}
}

.card {
  position: relative;
  padding: 60px 80px;
  border-radius: 24px;
  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(20px);
  box-shadow: 0 25px 60px rgba(0,0,0,0.25);
  text-align: center;
}

h1 {
  font-size: 28px;
  font-weight: 400;
  margin-bottom: 10px;
  opacity: 0.9;
}

.name {
  font-size: 56px;
  font-weight: 700;
  margin-bottom: 25px;
}

.question {
  font-size: 22px;
  margin-bottom: 50px;
  font-weight: 500;
}

.buttons {
  position: relative;
  height: 80px;
}

button {
  padding: 14px 40px;
  font-size: 16px;
  border-radius: 40px;
  border: none;
  cursor: pointer;
  transition: 0.3s ease;
  position: absolute;
}

#yes {
  background: #ff2e63;
  color: white;
  left: 30%;
}

#yes:hover {
  transform: scale(1.1);
  box-shadow: 0 10px 30px rgba(255, 46, 99, 0.6);
}

#no {
  background: #222;
  color: white;
  left: 60%;
}

/* Floating hearts */
.heart {
  position: absolute;
  font-size: 20px;
  animation: floatUp linear infinite;
  opacity: 0.8;
}

@keyframes floatUp {
  to {
    transform: translateY(-120vh);
    opacity: 0;
  }
}

.final {
  text-align: center;
  animation: fadeIn 0.8s ease forwards;
}

@keyframes fadeIn {
  from {opacity: 0; transform: scale(0.9);}
  to {opacity: 1; transform: scale(1);}
}
</style>
</head>

<body>

<div class="card">
  <h1>Hey</h1>
  <div class="name">Anjali</div>
  <div class="question">Will you be my Valentine? ❤️</div>

  <div class="buttons">
    <button id="yes">Yes ❤️</button>
    <button id="no">No 😢</button>
  </div>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");

/* Move NO button */
function moveNoButton() {
  const card = document.querySelector(".card");
  const rect = card.getBoundingClientRect();

  const maxX = rect.width - noBtn.offsetWidth;
  const maxY = 50;

  noBtn.style.left = Math.random() * maxX + "px";
  noBtn.style.top = Math.random() * maxY + "px";
}

/* Desktop hover */
noBtn.addEventListener("mouseenter", moveNoButton);

/* Mobile touch */
noBtn.addEventListener("touchstart", function(e) {
  e.preventDefault();
  moveNoButton();
});

/* YES click */
yesBtn.addEventListener("click", () => {
  document.body.innerHTML = `
    <div class="final">
      <h1 style="font-size:48px;">She Said YES ❤️</h1>
      <p style="margin-top:20px;font-size:20px;">
        Anjali, I love you forever 💖
      </p>
    </div>
  `;
});

/* Floating hearts generator */
function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.bottom = "-20px";
  heart.style.animationDuration = (4 + Math.random() * 4) + "s";
  heart.style.fontSize = (15 + Math.random() * 20) + "px";
  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 8000);
}

setInterval(createHeart, 300);
</script>

</body>
</html>
